name: Deploy Broken

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "version=1.0.0" >> $GITHUB_OUTPUT

      - name: Use bad output ref
        run: echo ${{ steps.nonexistent_step.outputs.value }}

      - name: Bad shell
        shell: pwsh
        run: |
          echo "this is fine"

  notify:
    needs: [deploy, missing-job]
    runs-on: ubuntu-latest
    steps:
      - run: echo "done"
