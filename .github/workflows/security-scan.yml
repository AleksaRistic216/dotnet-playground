name: Security Scan

on:
  push:
    branches: [master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install security scanner
        run: dotnet tool install --global security-scan

      - name: Run scan
        run: security-scan dotnet-playground.sln
